<header class="main-header bg-dark text-white py-3 shadow-sm position-relative">
  <div class="container d-flex align-items-center justify-content-between">
    <a class="navbar-brand fw-bold text-white d-flex align-items-center gap-2" routerLink="/">
      <span class="logo-dot"></span> Créaprint
    </a>
    <nav class="d-none d-lg-flex align-items-center gap-4">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link text-white">Accueil</a>
      <a routerLink="/services" routerLinkActive="active" class="nav-link text-white">Services</a>
      <a routerLink="/portfolio" routerLinkActive="active" class="nav-link text-white">Réalisations</a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-link text-white">Contact</a>
      <a routerLink="/contact" class="btn btn-prune rounded-pill px-4 ms-3">Contact direct</a>
    </nav>
    <button
      class="navbar-toggler d-lg-none btn btn-outline-light border-0"
      type="button"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="navbarNavMobile"
      aria-label="Menu"
      (click)="toggleMobileMenu()"
    >
      <i class="bi bi-list display-5"></i>
    </button>
  </div>
  <div class="collapse bg-dark d-lg-none" [class.show]="mobileMenuOpen()" id="navbarNavMobile">
    <nav class="d-flex flex-column align-items-center gap-3 py-3">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link text-white" (click)="closeMobileMenu()">Accueil</a>
      <a routerLink="/services" routerLinkActive="active" class="nav-link text-white" (click)="closeMobileMenu()">Services</a>
      <a routerLink="/portfolio" routerLinkActive="active" class="nav-link text-white" (click)="closeMobileMenu()">Réalisations</a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-link text-white" (click)="closeMobileMenu()">Contact</a>
      <a routerLink="/contact" class="btn btn-prune rounded-pill px-4" (click)="closeMobileMenu()">Contact direct</a>
    </nav>
  </div>
</header>
